name: Android CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "releases/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build debug APK
        run: |
          gradle assembleDebug --stacktrace

      - name: Show APK info
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          ls -l "$APK"
          sha256sum "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: preset-camera-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to releases/
        run: |
          mkdir -p releases
          cp app/build/outputs/apk/debug/app-debug.apk releases/preset-camera-v1.0.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add releases/preset-camera-v1.0.apk
          git diff --cached --quiet || git commit -m "Publish preset-camera v1.0 APK [skip ci]"
          git push
